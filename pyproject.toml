[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostconsole"
version = "0.1.0"
description = "One offline HTML board aggregating every Ghost tool's latest local reports, read-only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "dashboard", "agents"]
dependencies = []

[project.scripts]
ghostconsole = "ghostconsole.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
